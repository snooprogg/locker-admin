@if (message(); as msg) {
  <div
    [attr.role]="type() === 'error' ? 'alert' : 'status'"
    animate.enter="toast-enter"
    animate.leave="toast-leave"
    class="fixed top-5 right-5 z-60 flex w-[min(24rem,calc(100vw-2.5rem))] items-start gap-3 rounded-md border bg-white dark:bg-zinc-900 pt-3 pr-3 pb-3 pl-4 shadow-lg shadow-zinc-950/10 dark:shadow-zinc-950/50 transition-all duration-200"
    [class]="type() === 'error' ? 'border-red-500/40' : 'border-emerald-500/40'"
  >
    <span
      class="mt-px flex size-5 shrink-0 items-center justify-center rounded-full"
      [class]="type() === 'error' ? 'bg-red-500/15 text-red-500' : 'bg-emerald-500/15 text-emerald-500'"
    >
      @if (type() === 'error') {
        <svg lucideCircleAlert class="size-3.5" aria-hidden="true"></svg>
      } @else {
        <svg lucideCheck class="size-3.5" aria-hidden="true"></svg>
      }
    </span>
    <p class="m-0 flex-1 pt-0.5 font-sans text-xs leading-relaxed text-zinc-950 dark:text-zinc-100">{{ msg }}</p>
    <button
      type="button"
      (click)="closed.emit()"
      aria-label="Dismiss notification"
      class="-mt-0.5 -mr-0.5 flex size-6 shrink-0 items-center justify-center rounded-full border border-zinc-200 dark:border-zinc-800 bg-white dark:bg-zinc-900 text-zinc-500 hover:text-red-500 hover:border-red-500/40 cursor-pointer transition-all duration-200"
    >
      <svg lucideX class="size-3.5" aria-hidden="true"></svg>
    </button>
  </div>
}
